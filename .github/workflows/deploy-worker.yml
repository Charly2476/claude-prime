# Worker claude-prime-api (dossier worker/) : tests, puis déploiement MANUEL.
#
# - Tests : automatiques à chaque envoi (toutes branches) qui touche worker/ ou ce fichier,
#   et avant chaque déploiement.
# - Déploiement : seulement à la main (onglet Actions > Worker API > Run workflow),
#   seulement depuis main (branche de production), seulement si les tests passent.
#
# Ce workflow ne publie PAS le site : outils.html et index.html restent publiés comme avant
# par Cloudflare Pages (projet claude-prime, branche main) et par GitHub Pages.
#
# Secrets du dépôt (Settings > Secrets and variables > Actions), aucune valeur ici :
#   CLOUDFLARE_API_TOKEN   jeton Cloudflare avec « Workers Scripts: Edit » (déploiement du Worker)
#   TOKEN_D1               jeton Cloudflare avec « D1: Edit » (migrations de la base projet-db)
#   CLOUDFLARE_ACCOUNT_ID  identifiant du compte Cloudflare
#
# Ordre du déploiement : tests -> migrations D1 (projet-db) -> Worker.
# Si une migration échoue, le Worker n'est pas déployé.
name: Worker API

on:
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22' # wrangler 4.156 et miniflare 4 demandent Node >= 22

jobs:
  tests:
    name: Tests du Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Installer exactement les versions de package-lock.json
        run: npm ci

      - name: Tests de l'API (Miniflare, R2 et D1 simulés, faux Access et faux Turnstile)
        run: npm test

      - name: Vérifier la configuration wrangler.jsonc (sans rien envoyer)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-dry-run"

  deploy:
    name: Déploiement sur Cloudflare
    needs: tests
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Installer exactement les versions de package-lock.json
        run: npm ci

      - name: Vérifier que les secrets existent (sans les afficher)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_D1: ${{ secrets.TOKEN_D1 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          manque=0
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN absent"; manque=1; }
          [ -n "$TOKEN_D1" ] || { echo "::error::Secret TOKEN_D1 absent"; manque=1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID absent"; manque=1; }
          exit $manque

      - name: Vérifier que database_id (wrangler.jsonc) est un vrai identifiant D1
        run: |
          id=$(grep -oE '"database_id"[[:space:]]*:[[:space:]]*"[^"]*"' wrangler.jsonc | sed -E 's/.*"([^"]*)"$/\1/')
          if ! echo "$id" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::database_id « $id » n'est pas un identifiant D1 (UUID). Copiez-le depuis Storage & Databases > D1 > projet-db."
            exit 1
          fi

      - name: Appliquer les migrations D1 (projet-db) avant le déploiement
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TOKEN_D1 }} # wrangler lit ce nom ; la valeur vient de TOKEN_D1
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply projet-db --remote

      - name: Déployer claude-prime-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
