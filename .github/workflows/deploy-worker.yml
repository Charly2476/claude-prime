# Déploie le Worker claude-prime-api (dossier worker/) sur Cloudflare.
# Se lance à chaque envoi sur main qui touche worker/ ou ce fichier, ou à la main
# (onglet Actions > Déployer le Worker > Run workflow).
#
# Secrets du dépôt (Settings > Secrets and variables > Actions) :
#   CLOUDFLARE_API_TOKEN   obligatoire : jeton avec la permission « Workers Scripts: Edit »
#   CLOUDFLARE_ACCOUNT_ID  facultatif : nécessaire seulement si le jeton voit plusieurs comptes
# Aucune valeur secrète n'est écrite ici.
name: Déployer le Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Tester l'API (aucun déploiement si un test échoue)
        run: npm test

      - name: Déployer sur Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
